<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design World — Explore New Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000;
    --fg: #fff;
    --pad-x: clamp(20px, 6.95vw, 120px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    min-height: 520px;
    overflow: hidden;
    background: var(--bg);
  }

  /* WebGL layer: background headline + glass cube */
  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #scene.dragging { cursor: grabbing; }

  /* UI layer sits above the canvas but lets drags pass through */
  .ui { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .ui a, .ui button { pointer-events: auto; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Nav ---------- */
  .nav {
    position: absolute;
    top: clamp(24px, 4.7vh, 40px);
    left: var(--pad-x);
    right: var(--pad-x);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .logo-mark {
    width: 20px;
    height: 40px;
    background: var(--fg);
    border-radius: 0 20px 20px 0;
  }
  .logo b { font-weight: 700; }
  .logo span { font-weight: 400; }

  .nav-links { display: flex; gap: clamp(20px, 4.1vw, 60px); list-style: none; }
  .nav-links a {
    color: var(--fg);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .35s ease;
  }
  .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }

  /* ---------- Arrows ---------- */
  .arrows {
    position: absolute;
    top: 18.9%;
    left: 76.7%;
    display: flex;
    gap: 32px;
    transform: translate(-19px, -50%);
  }
  .arrow {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2.5px solid var(--fg);
    background: transparent;
    color: var(--fg);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .25s, color .25s;
  }
  .arrow svg { width: 18px; height: 18px; }
  .arrow:hover { background: var(--fg); color: var(--bg); }

  /* ---------- Dots ---------- */
  .dots {
    position: absolute;
    right: calc(var(--pad-x) - 7px);
    top: 49.4%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 33px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--fg);
    background: var(--fg);
    cursor: pointer;
    transition: background .25s;
  }
  .dot.active { background: transparent; }

  /* ---------- Bottom-left tagline ---------- */
  .tagline {
    position: absolute;
    left: var(--pad-x);
    bottom: clamp(40px, 7.5vh, 70px);
    font-size: clamp(24px, 2.65vw, 44px);
    line-height: 1.2;
    font-weight: 300;
    letter-spacing: -0.01em;
  }
  .tagline strong { font-weight: 700; display: block; }

  /* ---------- Explore Now + line + 07 ---------- */
  .cta-row {
    position: absolute;
    left: 45.6%;
    right: -1vw;
    top: 88.7%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
  }
  .cta {
    flex: none;
    padding: 0 15px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    border: 1.5px solid rgba(255, 255, 255, .85);
    border-radius: 6px;
    background: rgba(0, 0, 0, .15);
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    text-decoration: none;
    cursor: pointer;
    transition: background .25s, color .25s;
  }
  .cta:hover { background: var(--fg); color: var(--bg); }
  .cta-line { flex: 1; height: 1.5px; background: rgba(255, 255, 255, .8); min-width: 40px; }
  .count {
    flex: none;
    font-size: clamp(140px, 19.8vw, 360px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.02em;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
    transform: translateY(6%);
    user-select: none;
  }

  /* Loading hint for the 3D model */
  .loader {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .6;
    transition: opacity .6s;
  }
  .loader.done { opacity: 0; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    .arrows { left: auto; right: var(--pad-x); top: 15%; transform: translateY(-50%); gap: 14px; }
    .tagline { bottom: clamp(150px, 20vh, 220px); }
    .cta-row { left: var(--pad-x); right: -3vw; top: auto; bottom: 24px; transform: none; }
    .count { font-size: clamp(120px, 22vw, 200px); }
  }
  @media (max-width: 640px) {
    .nav-links { gap: 16px; }
    .nav-links a, .logo { font-size: 13px; }
    .dots { gap: 20px; right: 16px; }
    .dot { width: 10px; height: 10px; }
    .cta-row { right: -8vw; }
    .count { font-size: 120px; }
  }
  @media (max-width: 420px) {
    .nav-links li:nth-child(2) { display: none; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>

  <div class="ui">
    <h1 class="sr-only">Explore New Ideas</h1>

    <header class="nav">
      <a href="#" class="logo" aria-label="Design World home">
        <i class="logo-mark"></i><b>Design</b><span>World</span>
      </a>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </header>

    <div class="arrows">
      <button class="arrow" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button class="arrow" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>

    <nav class="dots" aria-label="Slides">
      <button class="dot" aria-label="Slide 1"></button>
      <button class="dot active" aria-label="Slide 2"></button>
      <button class="dot" aria-label="Slide 3"></button>
    </nav>

    <p class="tagline">Let's Build the<br />Future of <strong>Design.</strong></p>

    <div class="cta-row">
      <a href="#" class="cta">Explore Now</a>
      <span class="cta-line"></span>
      <span class="count" aria-hidden="true">07</span>
    </div>

    <div class="loader" id="loader">Loading model</div>
  </div>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// Glass cuboid generated with Higgsfield (image_to_3d) — hosted GLB
const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

const HEADLINE = ['Explore', 'New', 'Ideas'];

const canvas = document.getElementById('scene');
const hero = document.getElementById('hero');
const loader = document.getElementById('loader');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 10);

/* ---------- Background headline, drawn to a 2D canvas ---------- */
const textCanvas = document.createElement('canvas');
const tctx = textCanvas.getContext('2d');
const textTexture = new THREE.CanvasTexture(textCanvas);
textTexture.colorSpace = THREE.SRGBColorSpace;
textTexture.minFilter = THREE.LinearFilter;
textTexture.generateMipmaps = false;

function drawHeadline(w, h, dpr) {
  textCanvas.width = Math.round(w * dpr);
  textCanvas.height = Math.round(h * dpr);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.fillStyle = '#000';
  tctx.fillRect(0, 0, w, h);

  const mobile = w < 768 || w / h < 1;
  let fs = Math.min(h * 0.21, w * (mobile ? 0.21 : 0.118));
  tctx.font = `800 ${fs}px Poppins`;
  const widest = Math.max(...HEADLINE.map(t => tctx.measureText(t).width));
  const maxW = w * (mobile ? 0.9 : 0.5);
  if (widest > maxW) { fs *= maxW / widest; tctx.font = `800 ${fs}px Poppins`; }

  const gap = fs * 1.07;
  const cap = fs * 0.7;
  const cx = w * (mobile ? 0.5 : 0.505);
  const cy = h * (mobile ? 0.45 : 0.468);

  tctx.fillStyle = '#e9e9e9';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'alphabetic';
  HEADLINE.forEach((line, i) => {
    tctx.fillText(line, cx, cy + cap / 2 + (i - 1) * gap);
  });
  textTexture.needsUpdate = true;
}

// Fullscreen quad showing the headline
const bgScene = new THREE.Scene();
const bgQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    uniforms: { uTex: { value: textTexture } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D uTex;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(uTex, vUv);
        #include <colorspace_fragment>
      }
    `,
    depthTest: false,
    depthWrite: false,
  })
);
bgQuad.frustumCulled = false;
bgScene.add(bgQuad);

/* ---------- Glass material: screen-space refraction + dispersion ---------- */
const glassVertex = /* glsl */`
  varying vec3 vNormal;
  varying vec3 vEye;
  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vec4 mvPos = viewMatrix * worldPos;
    gl_Position = projectionMatrix * mvPos;
    vNormal = normalize(normalMatrix * normal);
    vEye = normalize(mvPos.xyz);
  }
`;

const glassFragment = /* glsl */`
  uniform sampler2D uTexture;
  uniform vec2 uResolution;
  uniform float uIorR, uIorY, uIorG, uIorC, uIorB, uIorP;
  uniform float uRefractPower;
  uniform float uChromatic;
  uniform float uSaturation;
  uniform float uShininess;
  uniform float uDiffuseness;
  uniform float uFresnelPower;
  uniform float uBackside;
  uniform vec3 uLight;
  varying vec3 vNormal;
  varying vec3 vEye;

  #define LOOP 16

  vec3 sat(vec3 rgb, float adj) {
    const vec3 W = vec3(0.2125, 0.7154, 0.0721);
    vec3 intensity = vec3(dot(rgb, W));
    return mix(intensity, rgb, adj);
  }

  float specular(vec3 light, float shininess, float diffuseness, vec3 n, vec3 eye) {
    vec3 lightVector = normalize(-light);
    vec3 halfVector = normalize(eye + lightVector);
    float NdotL = dot(n, lightVector);
    float NdotH = dot(n, halfVector);
    float kDiffuse = max(0.0, NdotL);
    float kSpecular = pow(max(NdotH, 0.0), shininess);
    return kSpecular + kDiffuse * diffuseness;
  }

  float fresnel(vec3 eye, vec3 n, float power) {
    return pow(1.0 + dot(eye, n), power);
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;
    vec3 n = normalize(vNormal);
    // three.js flips winding for BackSide, so gl_FrontFacing can't be trusted here
    if (uBackside > 0.5) n = -n;
    vec3 eye = normalize(vEye);

    vec3 color = vec3(0.0);
    for (int i = 0; i < LOOP; i++) {
      float slide = float(i) / float(LOOP) * 0.045;

      vec3 rR = refract(eye, n, 1.0 / uIorR);
      vec3 rY = refract(eye, n, 1.0 / uIorY);
      vec3 rG = refract(eye, n, 1.0 / uIorG);
      vec3 rC = refract(eye, n, 1.0 / uIorC);
      vec3 rB = refract(eye, n, 1.0 / uIorB);
      vec3 rP = refract(eye, n, 1.0 / uIorP);

      float r = texture2D(uTexture, uv + rR.xy * (uRefractPower + slide * 1.0) * uChromatic).x * 0.5;
      float y = (texture2D(uTexture, uv + rY.xy * (uRefractPower + slide * 1.0) * uChromatic).x * 2.0 +
                 texture2D(uTexture, uv + rY.xy * (uRefractPower + slide * 1.0) * uChromatic).y * 2.0 -
                 texture2D(uTexture, uv + rY.xy * (uRefractPower + slide * 1.0) * uChromatic).z) / 6.0;
      float g = texture2D(uTexture, uv + rG.xy * (uRefractPower + slide * 2.0) * uChromatic).y * 0.5;
      float c = (texture2D(uTexture, uv + rC.xy * (uRefractPower + slide * 2.5) * uChromatic).y * 2.0 +
                 texture2D(uTexture, uv + rC.xy * (uRefractPower + slide * 2.5) * uChromatic).z * 2.0 -
                 texture2D(uTexture, uv + rC.xy * (uRefractPower + slide * 2.5) * uChromatic).x) / 6.0;
      float b = texture2D(uTexture, uv + rB.xy * (uRefractPower + slide * 3.0) * uChromatic).z * 0.5;
      float p = (texture2D(uTexture, uv + rP.xy * (uRefractPower + slide * 1.0) * uChromatic).z * 2.0 +
                 texture2D(uTexture, uv + rP.xy * (uRefractPower + slide * 1.0) * uChromatic).x * 2.0 -
                 texture2D(uTexture, uv + rP.xy * (uRefractPower + slide * 1.0) * uChromatic).y) / 6.0;

      float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
      float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
      float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

      color += vec3(R, G, B);
    }
    color /= float(LOOP);
    color = sat(color, uSaturation);

    // Lighting: two soft key lights + rim fresnel for the bright glass edges
    float spec = specular(uLight, uShininess, uDiffuseness, n, -eye);
    spec += specular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, -eye) * 0.6;
    color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

    float f = fresnel(eye, n, uFresnelPower);
    color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

    // Subtle base tint so the glass body reads on pure black
    color += vec3(0.004, 0.005, 0.007);

    gl_FragColor = vec4(color, 1.0);
    #include <colorspace_fragment>
  }
`;

const glassUniforms = () => ({
  uTexture: { value: null },
  uResolution: { value: new THREE.Vector2() },
  uIorR: { value: 1.15 },
  uIorY: { value: 1.16 },
  uIorG: { value: 1.18 },
  uIorC: { value: 1.22 },
  uIorB: { value: 1.22 },
  uIorP: { value: 1.22 },
  uRefractPower: { value: 0.3 },
  uChromatic: { value: 0.5 },
  uSaturation: { value: 1.08 },
  uShininess: { value: 90.0 },
  uDiffuseness: { value: 0.02 },
  uFresnelPower: { value: 5.0 },
  uBackside: { value: 0 },
  uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) },
});

const frontMat = new THREE.ShaderMaterial({
  vertexShader: glassVertex,
  fragmentShader: glassFragment,
  uniforms: glassUniforms(),
  side: THREE.FrontSide,
});
const backMat = new THREE.ShaderMaterial({
  vertexShader: glassVertex,
  fragmentShader: glassFragment,
  uniforms: glassUniforms(),
  side: THREE.BackSide,
});
backMat.uniforms.uBackside.value = 1;
backMat.uniforms.uRefractPower.value = 0.22;

// Render targets: headline only, then headline + cube backfaces
const rtOpts = { type: THREE.HalfFloatType };
let rtBack = new THREE.WebGLRenderTarget(1, 1, rtOpts);
let rtFront = new THREE.WebGLRenderTarget(1, 1, rtOpts);
backMat.uniforms.uTexture.value = rtBack.texture;
frontMat.uniforms.uTexture.value = rtFront.texture;

/* ---------- Cube scene ---------- */
const scene = new THREE.Scene();
const pivot = new THREE.Group();      // screen placement + scale
const spinner = new THREE.Group();    // user / auto rotation
pivot.add(spinner);
scene.add(pivot);

let cube = null;
const baseEdge = 1; // model is normalised to a unit cube

function prepareGeometry(geometry) {
  let g = geometry.clone();
  g.deleteAttribute('uv');
  g.deleteAttribute('color');
  g.deleteAttribute('tangent');
  g = mergeVertices(g, 1e-4);
  g.computeVertexNormals();
  return g;
}

function useGeometry(geometry) {
  geometry.computeBoundingBox();
  const box = geometry.boundingBox;
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  geometry.translate(-center.x, -center.y, -center.z);
  const s = baseEdge / Math.max(size.x, size.y, size.z);
  geometry.scale(s, s, s);
  cube = new THREE.Mesh(geometry, frontMat);
  spinner.add(cube);
  loader.classList.add('done');
}

new GLTFLoader().load(
  MODEL_URL,
  (gltf) => {
    // Collect every mesh in the GLB into one geometry in model space
    const parts = [];
    gltf.scene.updateMatrixWorld(true);
    gltf.scene.traverse((o) => {
      if (o.isMesh) {
        const g = prepareGeometry(o.geometry);
        g.applyMatrix4(o.matrixWorld);
        parts.push(g);
      }
    });
    useGeometry(parts.length === 1 ? parts[0] : mergeGeometries(parts, false));
  },
  undefined,
  (err) => {
    console.warn('Model failed to load, using fallback geometry', err);
    useGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
  }
);

/* ---------- Layout ---------- */
let W = 0, H = 0, DPR = 1;

function layout() {
  W = Math.max(1, hero.clientWidth || window.innerWidth);
  H = Math.max(1, hero.clientHeight || window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  const bw = Math.round(W * DPR), bh = Math.round(H * DPR);
  rtBack.setSize(bw, bh);
  rtFront.setSize(bw, bh);
  frontMat.uniforms.uResolution.value.set(bw, bh);
  backMat.uniforms.uResolution.value.set(bw, bh);

  drawHeadline(W, H, DPR);

  // Place the cube where it sits in the reference (slightly right of centre, a touch high)
  const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  const visW = visH * camera.aspect;
  const mobile = W < 768 || W / H < 1;
  const sx = mobile ? 0.5 : 0.517;
  const sy = mobile ? 0.45 : 0.488;
  pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);
  const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29)); // on-screen edge length in px
  pivot.scale.setScalar((px / H) * visH);
}

/* ---------- Interaction: drag to rotate with inertia ---------- */
const rot = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.42, 0.62, 0.18));
spinner.quaternion.copy(rot);
const vel = { x: 0, y: 0 };
let dragging = false;
let last = { x: 0, y: 0, t: 0 };
let idleTimer = 0;
let spinTarget = null; // arrow button spins

const axisX = new THREE.Vector3(1, 0, 0);
const axisY = new THREE.Vector3(0, 1, 0);
const qTmp = new THREE.Quaternion();

function applyRotation(dx, dy) {
  qTmp.setFromAxisAngle(axisY, dx);
  spinner.quaternion.premultiply(qTmp);
  qTmp.setFromAxisAngle(axisX, dy);
  spinner.quaternion.premultiply(qTmp);
}

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  spinTarget = null;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  last = { x: e.clientX, y: e.clientY, t: performance.now() };
  vel.x = vel.y = 0;
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const now = performance.now();
  const dx = (e.clientX - last.x) * 0.008;
  const dy = (e.clientY - last.y) * 0.008;
  applyRotation(dx, dy);
  const dt = Math.max(now - last.t, 1) / 16.67;
  vel.x = dx / dt;
  vel.y = dy / dt;
  last = { x: e.clientX, y: e.clientY, t: now };
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  idleTimer = 0;
  canvas.classList.remove('dragging');
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function spin(dir) {
  spinTarget = { remaining: Math.PI / 2 * dir };
  vel.x = vel.y = 0;
}
document.getElementById('prev').addEventListener('click', () => spin(-1));
document.getElementById('next').addEventListener('click', () => spin(1));

document.querySelectorAll('.dot').forEach((d) => {
  d.addEventListener('click', () => {
    document.querySelectorAll('.dot').forEach((x) => x.classList.remove('active'));
    d.classList.add('active');
  });
});

/* ---------- Render loop ---------- */
const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const f = dt * 60;

  if (!dragging) {
    if (spinTarget) {
      const step = spinTarget.remaining * Math.min(1, 0.09 * f);
      applyRotation(step, 0);
      spinTarget.remaining -= step;
      if (Math.abs(spinTarget.remaining) < 0.0005) spinTarget = null;
    } else {
      // inertia
      applyRotation(vel.x * f, vel.y * f);
      const damp = Math.pow(0.94, f);
      vel.x *= damp;
      vel.y *= damp;
      // gentle idle drift once the user lets go
      idleTimer += dt;
      const blend = Math.min(1, Math.max(0, idleTimer - 0.6));
      applyRotation(0.0035 * f * blend, 0.0012 * f * blend);
    }
  }

  // 1) headline into rtBack
  renderer.setRenderTarget(rtBack);
  renderer.render(bgScene, camera);

  if (cube) {
    // 2) headline + cube backfaces into rtFront
    renderer.setRenderTarget(rtFront);
    renderer.render(bgScene, camera);
    cube.material = backMat;
    renderer.autoClear = false;
    renderer.render(scene, camera);
    renderer.autoClear = true;
  }

  // 3) final: headline + cube front faces
  renderer.setRenderTarget(null);
  renderer.render(bgScene, camera);
  if (cube) {
    cube.material = frontMat;
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(scene, camera);
    renderer.autoClear = true;
  }

  requestAnimationFrame(tick);
}

window.addEventListener('resize', layout);

// Wait for Poppins so the canvas headline uses the right face
Promise.race([
  Promise.all([
    document.fonts.load('800 100px Poppins'),
    document.fonts.ready,
  ]),
  new Promise((r) => setTimeout(r, 2500)),
]).finally(() => {
  layout();
  tick();
});
document.fonts.addEventListener?.('loadingdone', () => drawHeadline(W, H, DPR));
</script>
